<script>

[1,2,3,4].forEach((o,i)=>{const m=ym(o),k=[1,.9,1.1,.95][i];T('inc',250000,'a2',m+'-01','Allowance','Monthly allowance');T('inc',Math.round(150000*k/1000)*1000,'a3',m+'-12','Business','CV design clients');[['Food',90000*k],['Transport',40000*k],['Education',70000],['Bills',30000]].forEach(c=>T('exp',Math.round(c[1]/1000)*1000,'a2',m+'-'+lz(5+Math.floor(Math.random()*15)),c[0],c[0]))});

${S.goals.length?S.goals.map(g=>{const c=gcur(g),p=Math.min(100,c/g.target*100);return`<div class="c"><div class="r sb"><b>${E(g.n)}</b><b>${Math.round(p*10)/10}%</b></div><div class="bar"><i style="width:${p}%"></i></div><div class="r sb m"><span>${m(c)} / ${m(g.target)}</span><span>${g.date?'by '+g.date:''}</span></div><div class="r" style="margin-top:10px"><button class="b p s" data-a="add" data-t="sv" data-g="${g.id}">Add money</button><button class="b s" data-a="add" data-t="wd" data-g="${g.id}">Withdraw</button><button class="b s" data-a="egoal" data-id="${g.id}">Edit</button><button class="b s" data-a="dgoal" data-id="${g.id}">✕</button></div></div>`}).join(''):`<div class="c">${em('No savings goals','Create a goal and start building your future.')}</div>`}`},
ana(){const c=ym(0),a=sp(c),ks=Object.keys(a).sort((p,q)=>a[q]-a[p]),tot=ks.reduce((s,k)=>s+a[k],0),M=[5,4,3,2,1,0].map(o=>[ym(o),mo(ym(o))]),mx=Math.max(1,...M.flatMap(z=>[z[1].i,z[1].e])),any=S.tx.some(t=>t.t=='inc'||t.t=='exp');

<div class="c"><b>Monthly flow</b>${M.reverse().map(z=>`<div class="r sb m" style="padding:7px 0;border-bottom:1px solid var(--ln)"><span>${mn(z[0])}</span><span class="in">+${m(z[1].i)}</span><span class="ex">−${m(z[1].e)}</span><b>${z[1].r==null?'—':z[1].r+'%'}</b></div>`).join('')}<div class="m" style="margin-top:6px">Last column: savings rate = (income − expenses) ÷ income</div></div>
<div class="c"><b>Spending by category · ${mn(c)}</b>${ks.length?ks.map((k,i)=>`<div style="margin-top:10px"><div class="r sb"><span>${i<3?'★ ':''}${k}</span><span class="m">${m(a[k])} · ${Math.round(a[k]/tot*100)}%</span></div><div class="bar"><i style="width:${a[k]/ks.length&&a[k]/a[ks[0]]*100}%"></i></div></div>`).join(''):em('No expenses this month','Spending will appear here.')}<div class="m" style="margin-top:8px">★ Top spending categories</div></div>`}
<div class="r sb"><h2>Budgets · ${mn(c)}</h2><button class="b s" data-a="abud">+ Budget</button></div><div class="c">${budRows()}</div>`},

function render(){const t=S.set.theme=='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):S.set.theme;document.documentElement.dataset.t=t;$('#main').innerHTML=VW[V]();
